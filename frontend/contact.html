<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#4f46e5" />
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-inline' https://cdn.jsdelivr.net; style-src 'self' 'unsafe-inline'; img-src 'self' data: https:; connect-src 'self' https://*.supabase.co https://*.upstash.io;">
  <title>Contact — Classroom Hub</title>
  <link rel="manifest" href="manifest.json" />
  <link rel="stylesheet" href="css/style.css" />
  <link rel="icon" href="assets/favicon.ico" sizes="any" />
  <link rel="apple-touch-icon" href="assets/apple-touch-icon.png" />
  <script src="https://cdn.jsdelivr.net/npm/dompurify@3.1.6/dist/purify.min.js" defer></script>
</head>
<body>
  <header id="mainHeader"></header>
  <main>
    <section class="page active">
      <h1>Contact Us</h1>
      <p class="subtitle">We'd love to hear from you</p>
      <form class="contact-form card" id="contactForm">
        <div class="form-group">
          <label for="cName">Name *</label>
          <input type="text" id="cName" required maxlength="80" autocomplete="name" />
        </div>
        <div class="form-group">
          <label for="cStatus">Status *</label>
          <select id="cStatus" required>
            <option value="">Select status...</option>
            <option value="Student">Student</option>
            <option value="Parent">Parent</option>
            <option value="Guardian">Guardian</option>
            <option value="Citizen">Citizen</option>
          </select>
        </div>
        <div class="form-group" id="classGroup" style="display:none">
          <label for="cClass">Class *</label>
          <select id="cClass">
            <option value="">Select class...</option>
            <option>Grade 9</option><option>Grade 10</option>
            <option>Grade 11 Advanced Maths</option><option>Grade 11 General Maths</option>
            <option>Grade 12 Advanced Maths</option><option>Grade 12 General Maths</option>
          </select>
        </div>
        <div class="form-group">
          <label for="cContact">Phone / Email *</label>
          <input type="text" id="cContact" required maxlength="100" autocomplete="email" />
        </div>
        <div class="form-group">
          <label for="cMessage">Message *</label>
          <textarea id="cMessage" required maxlength="255"></textarea>
          <div class="char-count"><span id="cCount">0</span>/255</div>
        </div>
        <button type="submit" class="btn btn-primary">Send Message</button>
      </form>
    </section>
  </main>
  <footer id="mainFooter"></footer>
  <div class="modal-overlay" id="modal">
    <div class="modal">
      <div class="modal-head">
        <h2 id="modalTitle">Modal</h2>
        <button class="close-btn" onclick="closeModal()">×</button>
      </div>
      <div id="modalBody"></div>
    </div>
  </div>
  <div class="toast-container" id="toasts"></div>
  <script src="js/app.js"></script>
  <script src="js/notifications.js"></script>
  <script src="js/contact.js"></script>
</body>
</html>
